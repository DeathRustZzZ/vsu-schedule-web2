version: '3.7'

networks:
  vsu-schedule-network:
    name: vsu-schedule-network
    driver: bridge


services:
  eurekaserver:
    image: eurekaserver:latest
    build:
      context: ./eurekaserver
    ports:
      - '8761:8761'
    networks:
      - vsu-schedule-network

  api-gateway:
    image: api-gateway:latest
    build:
      context: ./api-gateway
    ports:
      - '8765:8765'
    networks:
      - vsu-schedule-network
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    depends_on:
      - eurekaserver

  schedule-service:
    image: schedule-service:latest
    build:
      context: ./schedule-service
    ports:
      - '9898:9898'
    networks:
      - vsu-schedule-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/schedule-db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - REDIS_URL=redis://redis:6379
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    depends_on:
      eurekaserver:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started

  telegram-service-rust:
    image: telegram-service-rust:latest
    build:
      context: ./telegram-service-rust
    networks:
      - vsu-schedule-network
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=postgresql://admin:admin@students-db:5432/students-db
      - SCHEDULE_API_BASE=http://api-gateway:8765
      - RUST_LOG=info
    depends_on:
      students-db:
        condition: service_healthy

  db:
    container_name: db
    image: postgres
    ports:
      - '5432:5432'
    volumes:
      - ./init-scripts-db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: schedule-db
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
    networks:
      - vsu-schedule-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d schedule-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  students-db:
    container_name: students-db
    image: postgres
    ports:
      - '5434:5432'
    volumes:
      - ./init-scripts-students:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: students-db
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: admin
    networks:
      - vsu-schedule-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d students-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'
    networks:
      - vsu-schedule-network
