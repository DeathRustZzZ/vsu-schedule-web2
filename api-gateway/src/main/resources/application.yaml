spring:
  application:
    name: api-gateway

  config:
    import:
      - classpath:routes/services-routes.yaml
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true



server:
  port: 8765
