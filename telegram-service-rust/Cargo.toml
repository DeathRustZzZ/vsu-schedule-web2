[package]
name = "tg_bot_vsu"
version = "0.1.0"
edition = "2024"

[dependencies]
#Асинхронный рантайм
tokio ={ version = "1.49.0", features = ["macros", "rt-multi-thread"]}

# Телеграмм бот 
teloxide = {version = "0.17.0", features = ["full"]}

# Для чтения .env
dotenvy = "0.15.7"

# date/time
chrono = "0.4.42"

#uuid
uuid = "1.19.0"

#Логи
log = "0.4.29"
pretty_env_logger = "0.5.0"

sqlx = {version = "0.9.0-alpha.1", features = ["postgres", "runtime-tokio", "macros", "tls-native-tls", "uuid", "chrono"]}
anyhow = "1.0.100"
reqwest = { version = "0.12.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
