databaseChangeLog:
  - changeSet:
      id: create-bot-user
      author: Alexey
      preConditions:
        - onFail: MARK_RAN
          or:
            - not:
                tableExists:
                  tableName: bot-users
      changes:
        - createTable:
            tableName: bot-users
            columns:
              - column:
                  name: user-id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: telegram-user-id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: chat-id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: varchar(150)
              - column:
                  name: faculty
                  type: varchar(150)
              - column:
                  name: group-id
                  type: varchar(150)
              - column:
                  name: subgroup-id
                  type: varchar(150)
              - column:
                  name: bot-state
                  type: varchar(150)
                  constraints:
                    nullable: false

      rollback:
        - dropTable:
            tableName: passengers